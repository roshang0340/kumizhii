<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111b32" />
    <title>நாளொரு வரி — A daily journal</title>
    <link rel="icon" id="app-favicon" href="/logo.png" />
    <script>
      (function() {
        var link = document.getElementById('app-favicon');
        var formats = ['/logo.png', '/logo.jpg', '/logo.jpeg', '/logo.webp', '/logo.svg'];
        var idx = 0;
        function tryNext() {
          if (idx < formats.length) {
            var img = new Image();
            img.onload = function() { if (link) link.href = formats[idx]; };
            img.onerror = function() { idx++; tryNext(); };
            img.src = formats[idx];
          }
        }
        tryNext();
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
